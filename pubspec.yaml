name: aktientool
description: Aktien finden und analysieren wird mit dem Aktientool viel einfacher.  
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=2.19.1 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart:
    git:
      url: https://github.com/koosoftware/fl_chart
      ref: b4c909c

  cupertino_icons: ^1.0.5
  url_strategy: ^0.2.0
  firebase_core: ^2.7.0
  cloud_firestore: ^4.4.3
  flutter_riverpod: ^2.2.0
  firebase_auth:
  http: ^0.13.5
  dio: ^5.0.1
  font_awesome_flutter: 10.4.0
  google_sign_in: 6.0.1
  google_sign_in_web_redirect: 0.0.1
  shared_preferences: 2.0.18
  url_launcher: ^6.1.10
  web_browser: ^0.5.0
  flutter_svg: ^2.0.2
  google_fonts: ^4.0.3
  responsive_framework: ^0.2.0
  carousel_slider: ^4.2.1
  data_table_2: 2.3.12
  translator: ^0.1.7
  intl: ^0.18.0

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  envied_generator: ^0.3.0
  build_runner: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

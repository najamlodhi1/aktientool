name: aktientool
description: Aktien finden und analysieren wird mit dem Aktientool viel einfacher.  
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=2.18.1 <3.0.0'


 
dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.55.2
  cupertino_icons: ^1.0.5
  url_strategy: ^0.2.0
  firebase_core: ^2.1.1
  cloud_firestore: ^4.0.3
  flutter_riverpod: ^2.0.2
  firebase_auth:
  http: ^0.13.5
  dio: ^4.0.6
  font_awesome_flutter:
  google_sign_in:
  google_sign_in_web_redirect:
  shared_preferences:
  webview_flutter:
  url_launcher: ^6.1.6
  webviewx: ^0.2.1
  web_browser: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/


<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

    https://gurkan90.github.io/aktientool-web-upload/
    https://aktientool.net/
  -->

  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="Aktien-Screener - Aktien-Finder - Aktientool.net" content="Aktien analysieren geht schnell und unkompliziert mit dem AktienTool. Jetzt kostenlos ausprobieren.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aktien analysieren geht schnell und unkompliziert mit dem AktienTool. Jetzt kostenlos ausprobieren.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>aktientool</title>
  <link rel="manifest" href="manifest.json">


  <style>
    .loader {
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .lds-hourglass {
        background-color: black;
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
    }

    .lds-hourglass:after {
        background-color: black;
        content: " ";
        display: block;
        border-radius: 70%;
        width: 0;
        height: 0;
        margin: 8px;
        box-sizing: border-box;
        border: 32px solid #a659ff;
        border-color: #a659ff transparent #a659ff transparent;
        animation: lds-hourglass 1.2s infinite;
    }
    
    @keyframes lds-hourglass {
        0% {
            transform: rotate(0);
            animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19);
        }
        50% {
            transform: rotate(900deg);
            animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        100% {
            transform: rotate(1800deg);
        }
    }

    </style>


  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <script src="https://js.stripe.com/v3/"></script>

</head>
<body>

  <div class="loader">
    <div class="lds-hourglass"></div>
</div>



  <script>
    window.addEventListener('load', function(ev) {
      //let loading = document.getElementsByClassName('#loading');
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        //loading.remove();
        return appRunner.runApp();
      });
    });
  </script>

</script>
</body>
</html>
